[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-ai"
version = "0.1.0"
description = "Blackjack AI — reinforcement learning meets card games"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["blackjack", "reinforcement-learning", "ai", "card-games"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "kagglehub>=0.2.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
bj-simulate = "scripts.run_simulation:main"
bj-setup    = "scripts.setup_env:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short --strict-markers"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple components together",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["blackjack", "ml", "backend"]
omit   = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 60

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM"]
ignore  = ["B008"]   # FastAPI Depends() in default args

[tool.mypy]
python_version      = "3.11"
strict              = false
ignore_missing_imports = true
disallow_untyped_defs  = true
warn_return_any        = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["blackjack*", "ml*", "backend*"]
